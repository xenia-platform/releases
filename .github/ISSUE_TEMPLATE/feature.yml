name: Idea
description: Something xenia could do
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The problem, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it could look
      description: A config snippet, a command, or how another server does it.
