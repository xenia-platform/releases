name: Bug
description: Something xenia does wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `xenia --version`, or the image tag.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How to make it happen
      description: The config (or the part that matters), the command line, and the requests. Leave out keys, tokens and private addresses.
      render: js
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: What xenia printed, and the access log lines if they help.
      render: text
